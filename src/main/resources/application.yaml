spring:
  application:
    name: LibraryManagement

  datasource:
    # Đảm bảo tên database khớp với lệnh CREATE DATABASE ở trên
    url: jdbc:mysql://localhost:3306/librarymanagement_db?useSSL=false&serverTimezone=UTC&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: root
  jpa:
    # BỎ DÒNG database-platform ĐI (Hibernate sẽ tự nhận diện)
    hibernate:
      ddl-auto: update 
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  security: #cấu hình security
    user:
      name: admin
      password: admin@123   

server: #cấu hình server
  port: 8090