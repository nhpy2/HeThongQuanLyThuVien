spring:
  application:
    name: LibraryManagement

  datasource: #cấu hình db
      url: jdbc:h2:mem:libraryManagement_db
      driver-class-name: org.h2.Driver
      username: sa
      password: ""

  h2: #cấu hình giao diện web db
    console:
      enabled: true
      path: /h2-console

  jpa: #cấu hình jpa hibernate
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate.format_sql: true
    defer-datasource-initialization: true

  security: #cấu hình security
    user:
      name: admin
      password: admin@123   

server: #cấu hình server
  port: 8090